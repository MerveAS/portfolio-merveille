<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merveille Aganze Sami | Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            page: '#ffffff',
            shell: '#171717',
            ink: '#111111',
            muted: '#4b4b4b',
            line: '#d9d9d9',
            accent1: '#e2a400'
          },
          boxShadow: {
            page: '0 14px 40px rgba(0,0,0,0.22)'
          },
          fontFamily: {
            sans: ['Arial', 'Helvetica', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-shell text-white font-sans antialiased">
  <div class="w-full min-h-screen bg-page py-6 md:py-8">
    <section class="bg-page text-ink min-h-screen">
      <div class="px-8 md:px-16 pt-8 md:pt-10 pb-8 md:pb-10 min-h-screen flex flex-col">
        <header class="flex items-center justify-between gap-6 mb-10">
          <a href="index.html" class="text-lg md:text-[2rem] font-bold tracking-tight">Merveille AGANZE SAMI</a>

         <nav class="flex flex-wrap justify-center md:justify-end items-center text-[11px] sm:text-xs md:text-[15px] gap-2 md:gap-4 lg:gap-6">
            <a href="index.html" class="hover:opacity-60 transition">Accueil</a>
            <span class="text-gray-500">|</span>
            <a href="cv.html" class="hover:opacity-60 transition">CV</a>
            <span class="text-gray-500">|</span>
            <a href="expertises.html" class="hover:opacity-60 transition">Expertises</a>
            <span class="text-gray-500">|</span>
            <a href="contact.html" class="font-semibold">Contact</a>
          </nav>
        </header>

        <div class="flex-1 flex items-start">
          <div class="w-full grid md:grid-cols-[0.9fr_1.1fr] gap-12 lg:gap-16 pt-4 md:pt-10">
            <div class="max-w-[280px]">
              <h2 class="text-3xl font-bold mb-10">Contact</h2>

              <div class="space-y-8">
                <div>
                  <h3 class="text-xl font-semibold mb-2">Phone</h3>
                  <p class="text-muted">+243 850 012 270</p>
                </div>

                <div>
                  <h3 class="text-xl font-semibold mb-2">Email</h3>
                  <a href="mailto:merveille.aganzesami@fitigroup.org" class="underline underline-offset-4 break-all text-muted hover:opacity-70">merveille.aganzesami@fitigroup.org</a>
                </div>
              </div>
            </div>

            <form class="space-y-5 max-w-[560px]">
              <div class="grid sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm mb-2">First Name</label>
                  <input type="text" class="w-full h-12 border border-gray-700 bg-transparent px-3 outline-none focus:ring-1 focus:ring-gray-700" />
                </div>
                <div>
                  <label class="block text-sm mb-2">Last Name</label>
                  <input type="text" class="w-full h-12 border border-gray-700 bg-transparent px-3 outline-none focus:ring-1 focus:ring-gray-700" />
                </div>
              </div>

              <div class="grid sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm mb-2">Email</label>
                  <input type="email" class="w-full h-12 border border-gray-700 bg-transparent px-3 outline-none focus:ring-1 focus:ring-gray-700" />
                </div>
                <div>
                  <label class="block text-sm mb-2">Subject</label>
                  <input type="text" class="w-full h-12 border border-gray-700 bg-transparent px-3 outline-none focus:ring-1 focus:ring-gray-700" />
                </div>
              </div>

              <div class="grid sm:grid-cols-[1fr_auto] gap-4 items-end">
                <div>
                  <label class="block text-sm mb-2">Message</label>
                  <textarea rows="5" class="w-full border border-gray-700 bg-transparent px-3 py-3 outline-none resize-none focus:ring-1 focus:ring-gray-700"></textarea>
                </div>
                <button type="submit" class="w-28 h-28 rounded-full bg-accent1 border border-gray-700 font-semibold self-center sm:self-end hover:-translate-y-1 transition">
                  Envoyer
                </button>
              </div>
            </form>
          </div>
        </div>

        <footer class="mt-auto pt-8 border-t border-line grid md:grid-cols-4 gap-6 text-sm">
          <div>
            <h3 class="font-semibold mb-2">Téléphone</h3>
            <p>+243 850 012 270</p>
          </div>

          <div>
            <h3 class="font-semibold mb-2">Email</h3>
            <a href="mailto:merveille.aganzesami@fitigroup.org" class="underline underline-offset-4 break-all hover:opacity-70">merveille.aganzesami@fitigroup.org</a>
          </div>

          <div>
            <h3 class="font-semibold mb-2">Suivez-moi</h3>
            <div class="flex items-center gap-4 text-lg font-semibold">
              <a href="https://www.linkedin.com/in/mervag27/?skipRedirect=true" target="_blank"  class="hover:opacity-70 transition">
               <i class="fab fa-linkedin"></i>
              </a>
              <a href="https://github.com/MerveAS" target="_blank" class="hover:opacity-70 transition">
                 <i class="fab fa-github"></i>
              </a>
            </div>
          </div>

          <div class="md:text-right">
            <p>© 2026 By Merveille AGANZE SAMI</p>
          </div>
        </footer>
      </div>
    </section>
  </div>
</body>
</html>
